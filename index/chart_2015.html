    { type: "slider", xAxisIndex: [0, 1, 2], bottom: 6, height: 20, borderColor: "#3a4550", backgroundColor: "#161c22", fillerColor: "rgba(78,161,255,0.15)", textStyle: { color: "#8b98a5" } }
  ],
  graphic: [
    { type: "text", left: 2, top: 12, style: { text: "纳斯达克综合指数（日收盘）", fill: "#5470c6", font: "600 13px sans-serif" } },
    { type: "text", left: 2, top: "33%", style: { text: "VIX 恐慌指数", fill: "#ee6666", font: "600 13px sans-serif" } },
    { type: "text", left: 2, top: "68%", style: { text: "美债收益率（2 年 / 10 年）", fill: "#e6edf3", font: "600 13px sans-serif" } }
  ],
  series: [
    Object.assign({}, makeLine("NASDAQCOM"), { xAxisIndex: 0, yAxisIndex: 0, lineStyle: { width: 1.4, color: "#5470c6" } }, buildMarks()),
    Object.assign({}, makeLine("VIXCLS"), { xAxisIndex: 1, yAxisIndex: 1, lineStyle: { width: 1.4, color: "#ee6666" } }),
    Object.assign({}, makeLine("DGS2"), { xAxisIndex: 2, yAxisIndex: 2, lineStyle: { width: 1.4, color: "#91cc75" } }),
    Object.assign({}, makeLine("DGS10"), { xAxisIndex: 2, yAxisIndex: 2, lineStyle: { width: 1.4, color: "#fac858" } })
  ]
}));

// 3) 单指标图（仅纳斯达克）
["NASDAQCOM"].forEach(function(sid){
  var el = document.getElementById("ch_" + sid);
  var chart = echarts.init(el);
  chart.setOption(Object.assign({}, baseOpt, {
    legend: { top: 0, textStyle: { color: "#c9d3dc" } },
    grid: { left: 60, right: 20, top: 32, bottom: 60 },
    xAxis: Object.assign({ type: "time", min: "dataMin" }, axisStyle),
    yAxis: Object.assign({ type: "value", scale: true, name: META[sid].unit, nameTextStyle: { color: "#8b98a5" } }, axisStyle),
    dataZoom: [
      { type: "inside", xAxisIndex: 0 },
      { type: "slider", xAxisIndex: 0, bottom: 8, height: 18, borderColor: "#3a4550", backgroundColor: "#161c22", fillerColor: "rgba(78,161,255,0.15)", textStyle: { color: "#8b98a5" } }
    ],
    toolbox: { right: 10, feature: { saveAsImage: { title: "保存图片" } } },
    series: [Object.assign({}, makeLine(sid), buildMarks())]
  }));
  window.addEventListener("resize", function(){ chart.resize(); });
});
window.addEventListener("resize", function(){ comp.resize(); });
window.addEventListener("resize", function(){ three.resize(); });
</script>
