{% extends "base.html" %}

{% block title %}宏观趋势 - 新闻抓取应用{% endblock %}

{% block head %}
<link rel="stylesheet" href="/static/css/macro.css">
{% endblock %}

{% block content %}
<div class="page-header macro-header">
    <div class="macro-header-text">
        <h1>宏观趋势</h1>
    </div>
    <div class="macro-toolbar">
        <span id="trendUpdated" class="macro-updated">加载中…</span>
        <button id="macroTrendReload" class="btn btn-primary">刷新图表</button>
    </div>
</div>

<div id="trendNotice"></div>
<div id="macroTrendRoot">
    <div class="loading">正在加载历史序列…</div>
</div>
{% endblock %}

{% block scripts %}
<script src="/static/js/echarts.min.js"></script>
<script src="/static/js/macro_charts.js"></script>
{% endblock %}
