{% extends "base.html" %}

{% block title %}财务指标 - 新闻抓取应用{% endblock %}

{% block content %}
<div class="page-header">
    <p class="form-hint">输入股票名称，展示已入库财务指标的数值（柱形图）与同比/环比增速（折线）（数据需先在「抓取控制」页面抓取入库）</p>
</div>

<div class="finance-query">
    <div class="finance-field">
        <label for="stockName">股票名称</label>
        <input id="stockName" type="text" placeholder="如 贵州茅台" value="贵州茅台">
    </div>
    <button id="queryBtn" class="btn btn-primary">查询并展示图表</button>
</div>

<div id="financeResult">
    <div class="finance-empty">请输入股票名称，点击「查询并展示图表」查看已入库的财务指标图表。</div>
</div>
{% endblock %}

{% block scripts %}
<script src="/static/js/echarts.min.js"></script>
<script>
let charts = [];

function disposeCharts() {
    charts.forEach(function (c) { try { c.dispose(); } catch (e) {} });
    charts = [];
}

// 懒加载:滚入视口才初始化图表
function lazyInit(elId, renderFn) {
    const el = document.getElementById(elId);
    if (!el) return;
    const io = new IntersectionObserver(function (entries) {
        entries.forEach(function (entry) {
            if (entry.isIntersecting) {
                io.disconnect();
                renderFn();
            }
        });
    }, { rootMargin: "200px" });
    io.observe(el);
}

async function runQuery() {
    const name = document.getElementById('stockName').value.trim();
    if (!name) { alert('请输入股票名称'); return; }
    const box = document.getElementById('financeResult');
    box.innerHTML = '<div class="loading">正在计算指标图表...</div>';
    disposeCharts();
    try {
        const url = `/api/finance/query?name=${encodeURIComponent(name)}`;
        const response = await fetchWithAuth(url);
        const data = await response.json();
        if (data.status !== 'ok') {
            box.innerHTML = `<div class="error-state"><h2>请求失败</h2><p>${escapeHtml(data.message || '未知错误')}</p></div>`;
            return;
        }
        renderIndicators(data);
    } catch (error) {
        box.innerHTML = `<div class="error-state"><h2>查询失败</h2><p>${escapeHtml(error.message)}</p></div>`;
    }
}

function renderIndicators(data) {
    const box = document.getElementById('financeResult');
    const inds = data.indicators || [];
    const periods = data.periods || [];
    if (!inds.length || !periods.length) {
        box.innerHTML = `<div class="finance-empty">未查询到「${escapeHtml(data.name || '')}」的财务数据，请先在「抓取控制」页面抓取入库。</div>`;
        return;
    }
    box.innerHTML = `
        <div class="indicator-head">
            <h2>${escapeHtml(data.name || '')} 财务指标</h2>
            <span class="indicator-sub">${periods.length} 期 · 货币单位：亿元</span>
        </div>
        <div class="indicator-grid">
            ${inds.map(function (ind, i) {
                return `<div class="indicator-card">
                    <div class="indicator-title">
                        ${escapeHtml(ind.name)}
                        <span class="indicator-tag">${escapeHtml(ind.growth_name)}</span>
                    </div>
                    <div class="indicator-chart" id="chart_${i}"></div>
                </div>`;
            }).join('')}
        </div>`;
    // 亿元单位指标（营收/现金/资产负债/负债类）共享「营业收入」量级的数值 Y 轴，便于横向对比
    // （%/天类指标不同单位保持各自自适应，增速轴独立）
    let axisMin = null, axisMax = null;
    inds.forEach(function (ind) {
        if (ind.unit !== '亿') return;
        ind.values.forEach(function (v) {
            if (v == null) return;
            if (axisMin === null || v < axisMin) axisMin = v;
            if (axisMax === null || v > axisMax) axisMax = v;
        });
    });
    const sharedRange = (axisMin === null || axisMax === null) ? null : (function () {
        const pad = (axisMax - axisMin) * 0.08 || (Math.abs(axisMax) * 0.08) || 1;
        return { min: axisMin >= 0 ? 0 : axisMin - pad, max: axisMax + pad };
    })();

    inds.forEach(function (ind, i) {
        const aligned = sharedRange && ind.unit === '亿' ? sharedRange : null;
        lazyInit('chart_' + i, function () { renderIndicatorChart('chart_' + i, ind, periods, aligned); });
    });
}

function renderIndicatorChart(elId, ind, periods, sharedRange) {
    const chart = echarts.init(document.getElementById(elId));
    charts.push(chart);
    const unitSuffix = ind.unit === '%' ? '%' : (ind.unit === '天' ? '天' : '亿元');
    const rightAxisName = ind.unit === '%' ? '同比(百分点)' : '增速%';
    const valueFmt = function (v) { return v == null ? '—' : v.toFixed(1); };
    const growthData = ind.growth.map(function (g) { return g == null ? null : g; });

    const leftYAxis = {
        type: 'value',
        name: unitSuffix,
        nameTextStyle: { color: '#666', fontSize: 10 },
        axisLabel: { color: '#888', fontSize: 10 },
        splitLine: { lineStyle: { color: '#eef0f3' } }
    };
    if (sharedRange) {
        leftYAxis.min = sharedRange.min;
        leftYAxis.max = sharedRange.max;
    }

    chart.setOption({
        tooltip: {
            trigger: 'axis',
            axisPointer: { type: 'shadow' },
            formatter: function (params) {
                const idx = params[0].dataIndex;
                let html = `<div style="font-weight:600">${escapeHtml(periods[idx])}</div>`;
                params.forEach(function (param) {
                    const marker = param.marker || '';
                    if (param.seriesType === 'line') {
                        const lab = ind.labels[idx];
                        const text = lab ? lab : valueFmt(param.value);
                        html += `<div>${marker}${escapeHtml(param.seriesName)}：<b>${text}</b></div>`;
                    } else {
                        html += `<div>${marker}${escapeHtml(param.seriesName)}：<b>${valueFmt(param.value)}</b></div>`;
                    }
                });
                return html;
            }
        },
        legend: { top: 0, textStyle: { color: '#555', fontSize: 11 }, itemWidth: 16 },
        grid: { left: 10, right: 10, top: 36, bottom: 6, containLabel: true },
        xAxis: {
            type: 'category',
            data: periods,
            axisLabel: { color: '#888', fontSize: 10, rotate: 45 },
            axisLine: { lineStyle: { color: '#d6dbe2' } }
        },
        yAxis: [
            leftYAxis,
            {
                type: 'value',
                name: rightAxisName,
                nameTextStyle: { color: '#666', fontSize: 10 },
                axisLabel: { color: '#888', fontSize: 10 },
                splitLine: { show: false }
            }
        ],
        series: [
            {
                name: `${ind.name}（${unitSuffix}）`,
                type: 'bar',
                data: ind.values,
                barMaxWidth: 24,
                itemStyle: { color: '#5470c6', borderRadius: [2, 2, 0, 0] }
            },
            {
                name: ind.growth_name,
                type: 'line',
                yAxisIndex: 1,
                data: growthData,
                connectNulls: false,
                symbolSize: 5,
                lineStyle: { color: '#ee6666', width: 1.6 },
                itemStyle: { color: '#ee6666' }
            }
        ]
    });
}

document.getElementById('queryBtn').addEventListener('click', runQuery);

window.addEventListener('resize', function () {
    charts.forEach(function (c) { try { c.resize(); } catch (e) {} });
});
</script>

<style>
.finance-query {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-end;
    gap: 1.25rem;
    background: white;
    border-radius: 12px;
    padding: 1.25rem 1.5rem;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    margin-bottom: 1.5rem;
}
.finance-field {
    display: flex;
    flex-direction: column;
    gap: 0.35rem;
}
.finance-field label {
    font-size: 0.85rem;
    color: #666;
    font-weight: 500;
}
.finance-field input {
    padding: 0.5rem 0.6rem;
    border: 1px solid #d6dbe2;
    border-radius: 8px;
    font-size: 0.95rem;
    color: #333;
    background: #fff;
    width: 180px;
}
.finance-empty {
    text-align: center;
    color: #999;
    font-size: 0.9rem;
    padding: 2.5rem 1rem;
    background: white;
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}
.loading {
    text-align: center;
    color: #667eea;
    font-size: 0.95rem;
    padding: 2.5rem;
    background: white;
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}
.error-state {
    text-align: center;
    color: #f14c4c;
    padding: 2.5rem;
    background: white;
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}
.error-state h2 { font-size: 1rem; margin-bottom: 0.5rem; }
.indicator-head {
    display: flex;
    align-items: baseline;
    gap: 1rem;
    margin-bottom: 1rem;
}
.indicator-head h2 { font-size: 1.3rem; color: #333; }
.indicator-sub { color: #999; font-size: 0.85rem; }
.indicator-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(520px, 1fr));
    gap: 1rem;
}
.indicator-card {
    background: white;
    border-radius: 12px;
    padding: 0.9rem 1rem 0.6rem;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}
.indicator-title {
    font-size: 0.95rem;
    font-weight: 600;
    color: #333;
    display: flex;
    align-items: center;
    gap: 0.5rem;
    margin-bottom: 0.25rem;
}
.indicator-tag {
    font-size: 0.7rem;
    font-weight: 400;
    color: #667eea;
    background: rgba(102,126,234,0.1);
    padding: 0.1rem 0.45rem;
    border-radius: 10px;
}
.indicator-chart {
    width: 100%;
    height: 260px;
}
@media (max-width: 900px) {
    .indicator-grid { grid-template-columns: 1fr; }
}
</style>
{% endblock %}
