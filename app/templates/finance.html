{% extends "base.html" %}

{% block title %}财务指标 - 新闻抓取应用{% endblock %}

{% block content %}
<div class="page-header">
    <h1>财务指标</h1>
    <p class="form-hint">输入股票名称，查询已入库的财务数据（数据需先在「抓取控制」页面抓取入库，指标图表将在后续更新中展示）</p>
</div>

<div class="finance-query">
    <div class="finance-field">
        <label for="stockName">股票名称</label>
        <input id="stockName" type="text" placeholder="如 贵州茅台" value="贵州茅台">
    </div>
    <button id="queryBtn" class="btn btn-primary">查询</button>
</div>

<div id="financeResult">
    <div class="finance-empty">请输入股票名称，点击「查询」查看已入库的财务数据。</div>
</div>
{% endblock %}

{% block scripts %}
<script>
async function runQuery() {
    const name = document.getElementById('stockName').value.trim();
    if (!name) { alert('请输入股票名称'); return; }
    const box = document.getElementById('financeResult');
    box.innerHTML = '<div class="loading">正在查询数据库...</div>';
    try {
        const url = `/api/finance/query?name=${encodeURIComponent(name)}`;
        const response = await fetchWithAuth(url);
        const data = await response.json();
        if (data.status !== 'ok') {
            box.innerHTML = `<div class="error-state"><h2>请求失败</h2><p>${escapeHtml(data.message || '未知错误')}</p></div>`;
            return;
        }
        const records = data.records || [];
        box.innerHTML = `
            <div class="finance-empty">
                已查询到「${escapeHtml(data.name || name)}」共 ${records.length} 期财务数据。<br>
                新的指标图表将在后续更新中展示。
            </div>`;
    } catch (error) {
        box.innerHTML = `<div class="error-state"><h2>查询失败</h2><p>${escapeHtml(error.message)}</p></div>`;
    }
}

document.getElementById('queryBtn').addEventListener('click', runQuery);
</script>

<style>
.finance-query {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-end;
    gap: 1.25rem;
    background: white;
    border-radius: 12px;
    padding: 1.25rem 1.5rem;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    margin-bottom: 1.5rem;
}
.finance-field {
    display: flex;
    flex-direction: column;
    gap: 0.35rem;
}
.finance-field label {
    font-size: 0.85rem;
    color: #666;
    font-weight: 500;
}
.finance-field input {
    padding: 0.5rem 0.6rem;
    border: 1px solid #d6dbe2;
    border-radius: 8px;
    font-size: 0.95rem;
    color: #333;
    background: #fff;
    width: 180px;
}
.finance-empty {
    text-align: center;
    color: #999;
    font-size: 0.9rem;
    padding: 2.5rem 1rem;
    background: white;
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}
.loading {
    text-align: center;
    color: #667eea;
    font-size: 0.95rem;
    padding: 2.5rem;
    background: white;
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}
.error-state {
    text-align: center;
    color: #f14c4c;
    padding: 2.5rem;
    background: white;
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}
.error-state h2 { font-size: 1rem; margin-bottom: 0.5rem; }
</style>
{% endblock %}
