{% extends "base.html" %}

{% block title %}财务指标 - 新闻抓取应用{% endblock %}

{% block content %}
<div class="page-header">
    <h1>财务指标</h1>
    <p class="form-hint">输入股票名称，展示已入库财务指标的趋势图表（数据需先在「抓取控制」页面抓取入库）</p>
</div>

<div class="finance-query">
    <div class="finance-field">
        <label for="stockName">股票名称</label>
        <input id="stockName" type="text" placeholder="如 贵州茅台" value="贵州茅台">
    </div>
    <button id="queryBtn" class="btn btn-primary">查询并展示图表</button>
</div>

<div id="financeResult">
    <div class="finance-empty">请输入股票名称，点击「查询并展示图表」查看已入库的财务指标趋势。</div>
</div>
{% endblock %}

{% block scripts %}
<script src="/static/js/echarts.min.js"></script>
<script>
const charts = [];

function toNumber(v) {
    if (v === null || v === undefined || v === '') return null;
    return Number(v);
}

function renderCharts(data) {
    const box = document.getElementById('financeResult');
    charts.forEach(c => c.dispose());
    charts.length = 0;

    if (data.status !== 'ok') {
        box.innerHTML = `<div class="error-state"><h2>请求失败</h2><p>${escapeHtml(data.message || '未知错误')}</p></div>`;
        return;
    }
    const records = data.records || [];
    if (!records.length) {
        box.innerHTML = `<div class="finance-empty">该股票暂无已入库的财务数据，请先在「抓取控制」页面抓取。</div>`;
        return;
    }

    const periods = records.map(r => r['报告期']);
    const cards = data.fields.map((field, i) => `
        <div class="chart-card">
            <div class="chart-title">${escapeHtml(field)}</div>
            <div class="chart-box" id="chart_${i}"></div>
        </div>
    `).join('');

    box.innerHTML = `
        <div class="chart-head">
            <h2>${escapeHtml(data.name || data.code)} 财务指标趋势</h2>
            <span class="chart-sub">${records.length} 期 · 金额单位：元</span>
        </div>
        <div class="chart-grid">${cards}</div>`;

    data.fields.forEach((field, i) => {
        const values = records.map(r => toNumber(r[field]));
        const chart = echarts.init(document.getElementById(`chart_${i}`));
        chart.setOption({
            tooltip: { trigger: 'axis' },
            grid: { left: 80, right: 24, top: 30, bottom: 44 },
            xAxis: {
                type: 'category',
                data: periods,
                axisLabel: { rotate: 45 }
            },
            yAxis: {
                type: 'value',
                scale: true
            },
            series: [{
                name: field,
                type: 'line',
                smooth: true,
                data: values,
                connectNulls: true,
                lineStyle: { width: 2 },
                itemStyle: { color: '#667eea' }
            }]
        });
        charts.push(chart);
    });
}

async function runQuery() {
    const name = document.getElementById('stockName').value.trim();
    if (!name) { alert('请输入股票名称'); return; }
    const box = document.getElementById('financeResult');
    box.innerHTML = '<div class="loading">正在查询数据库...</div>';
    try {
        const url = `/api/finance/query?name=${encodeURIComponent(name)}`;
        const response = await fetchWithAuth(url);
        const data = await response.json();
        renderCharts(data);
    } catch (error) {
        box.innerHTML = `<div class="error-state"><h2>查询失败</h2><p>${escapeHtml(error.message)}</p></div>`;
    }
}

document.getElementById('queryBtn').addEventListener('click', runQuery);
window.addEventListener('resize', () => charts.forEach(c => c.resize()));
</script>

<style>
.finance-query {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-end;
    gap: 1.25rem;
    background: white;
    border-radius: 12px;
    padding: 1.25rem 1.5rem;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    margin-bottom: 1.5rem;
}
.finance-field {
    display: flex;
    flex-direction: column;
    gap: 0.35rem;
}
.finance-field label {
    font-size: 0.85rem;
    color: #666;
    font-weight: 500;
}
.finance-field input {
    padding: 0.5rem 0.6rem;
    border: 1px solid #d6dbe2;
    border-radius: 8px;
    font-size: 0.95rem;
    color: #333;
    background: #fff;
    width: 160px;
}
.chart-head {
    display: flex;
    align-items: baseline;
    gap: 0.75rem;
    margin-bottom: 1rem;
}
.chart-head h2 { margin: 0; font-size: 1.1rem; color: #333; }
.chart-sub { font-size: 0.85rem; color: #999; }
.chart-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
    gap: 1.25rem;
}
.chart-card {
    background: white;
    border-radius: 12px;
    padding: 1rem 1.25rem;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}
.chart-title {
    font-size: 0.95rem;
    font-weight: 600;
    color: #555;
    margin-bottom: 0.5rem;
}
.chart-box { width: 100%; height: 280px; }
.finance-empty {
    text-align: center;
    color: #999;
    font-size: 0.9rem;
    padding: 2.5rem 1rem;
    background: white;
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}
.loading {
    text-align: center;
    color: #667eea;
    font-size: 0.95rem;
    padding: 2.5rem;
    background: white;
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}
.error-state {
    text-align: center;
    color: #f14c4c;
    padding: 2.5rem;
    background: white;
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}
.error-state h2 { font-size: 1rem; margin-bottom: 0.5rem; }
</style>
{% endblock %}
