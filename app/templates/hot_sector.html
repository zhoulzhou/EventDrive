{% extends "base.html" %}

{% block title %}今日热点 - 新闻抓取应用{% endblock %}

{% block content %}
<div class="page-header">
    <div class="hot-head">
        <h1>今日热点</h1>
        <div class="hot-actions">
            <p class="form-hint" id="metaInfo"></p>
            <button id="refreshBtn" type="button" class="btn-refresh">刷新盘面</button>
        </div>
    </div>
    <p class="form-hint">
        口径：新浪财经概念板块，按当日涨跌幅排序取前三（该数据源无概念级资金流，故不再计资金维度；
        涨跌家数与换手率由成分股聚合得到）。
        本页打开时只读取已存档数据（点击「刷新盘面」抓取或收盘后自动抓取），不会自动抓取行情。
    </p>
</div>

<div id="hotBody">
    <div class="loading">加载中...</div>
</div>
{% endblock %}

{% block scripts %}
<script>
// 打开页面：只读库中已有的快照，不发任何真实抓取请求
async function loadSaved() {
    const body = document.getElementById('hotBody');
    body.innerHTML = '<div class="loading">加载中...</div>';

    try {
        const response = await fetchWithAuth('/api/hot-sector');
        const data = await response.json();
        renderResult(data, false);
    } catch (error) {
        showError(error.message);
    }
}

// 点击「刷新盘面」：抓取最新盘面并落库，再回读展示
async function refreshMarket() {
    const body = document.getElementById('hotBody');
    body.innerHTML = '<div class="loading">正在抓取最新盘面数据...</div>';

    try {
        const response = await fetchWithAuth('/api/hot-sector/refresh', { method: 'POST' });
        const data = await response.json();
        renderResult(data, true);
    } catch (error) {
        showError(error.message);
    }
}

function showError(message, detailText) {
    const detail = detailText
        ? `<p class="hot-error-detail">${escapeHtml(detailText)}</p>` : '';
    document.getElementById('hotBody').innerHTML =
        `<div class="error-state"><h2>加载失败</h2><p>${escapeHtml(message || '未知错误')}</p>${detail}</div>`;
}

function renderResult(data, justRefreshed) {
    const meta = document.getElementById('metaInfo');
    const body = document.getElementById('hotBody');

    if (data.status === 'error') {
        meta.textContent = '';
        showError(data.message, data.detail);
        return;
    }

    if (data.status === 'empty') {
        meta.textContent = '';
        body.innerHTML = `
            <div class="hot-empty-state">
                <h2>暂无热点数据</h2>
                <p>${escapeHtml(data.message || '点击「刷新盘面」抓取当前盘面数据。')}</p>
            </div>`;
        return;
    }

    const reasonTag = data.reason_source === 'llm'
        ? ` · 归因由 ${data.reason_model || 'DeepSeek'} 生成`
        : ' · 归因为规则归纳（未配置 DeepSeek API Key）';
    const actionTag = justRefreshed ? ' · 刚刚刷新' : '';
    meta.textContent = `交易日：${data.trade_date} · 数据存档时间：${data.generated_at}${actionTag}${reasonTag}`;

    body.innerHTML = data.sectors.map(renderSector).join('')
        + (data.errors && data.errors.length
            ? `<div class="hot-warn">部分数据获取失败：${data.errors.map(escapeHtml).join('；')}</div>` : '');
}

function pct(value) {
    if (value == null) return '--';
    return (value >= 0 ? '+' : '') + value.toFixed(2) + '%';
}

// A 股惯例：涨红跌绿
function pctClass(value) {
    if (value == null) return '';
    return value >= 0 ? 'up' : 'down';
}

function renderSector(sector) {
    const stocks = (sector.stocks || []).map(st => `
        <tr>
            <td class="mono">${escapeHtml(st.code || '')}</td>
            <td>${escapeHtml(st.name || '')}</td>
            <td class="mono">${st.price == null ? '--' : st.price.toFixed(2)}</td>
            <td class="mono ${pctClass(st.change_percent)}">${pct(st.change_percent)}</td>
            <td class="mono">${st.amount == null ? '--' : st.amount.toFixed(2)}</td>
            <td class="mono">${st.turnover_rate == null ? '--' : st.turnover_rate.toFixed(2) + '%'}</td>
            <td class="mono">${st.amplitude == null ? '--' : st.amplitude.toFixed(2) + '%'}</td>
            <td class="mono">${st.pe == null ? '--' : st.pe.toFixed(1)}</td>
        </tr>
    `).join('');

    return `
        <div class="hot-card">
            <div class="hot-card-head">
                <span class="hot-rank">No.${sector.rank}</span>
                <span class="hot-name">${escapeHtml(sector.name)}</span>
                <span class="hot-change ${pctClass(sector.change_percent)}">${pct(sector.change_percent)}</span>
            </div>
            <div class="hot-stats">
                <span>成分股 <b>${sector.up_count} 涨 / ${sector.down_count} 跌</b></span>
                <span>换手率 <b>${sector.turnover_rate == null ? '--' : sector.turnover_rate.toFixed(2) + '%'}</b><span class="hot-stat-note">（成分股均值）</span></span>
                <span>领涨股 <b>${escapeHtml(sector.lead_stock || '--')}</b> ${pct(sector.lead_stock_change)}</span>
            </div>
            <div class="hot-reason">
                <span class="hot-reason-label">驱动原因</span>
                <span>${escapeHtml(sector.reason || '暂无')}</span>
            </div>
            <div class="hot-table-wrap">
                <table class="hot-table">
                    <thead>
                        <tr>
                            <th>代码</th><th>名称</th><th>最新价</th><th>涨跌幅</th>
                            <th>成交额(亿)</th><th>换手率</th><th>振幅</th><th>PE(动)</th>
                        </tr>
                    </thead>
                    <tbody>${stocks || '<tr><td colspan="8" class="hot-empty">暂无成分股数据</td></tr>'}</tbody>
                </table>
            </div>
        </div>
    `;
}

document.getElementById('refreshBtn').addEventListener('click', async () => {
    const btn = document.getElementById('refreshBtn');
    btn.disabled = true;
    btn.textContent = '抓取中...';
    try {
        await refreshMarket();
    } finally {
        btn.disabled = false;
        btn.textContent = '刷新盘面';
    }
});

loadSaved();
</script>

<style>
.page-header h1 { margin: 0 0 0.5rem; font-size: 1.35rem; color: #333; }
.hot-head { display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
.hot-actions { display: flex; align-items: center; gap: 0.75rem; }
.btn-refresh {
    padding: 0.35rem 1rem;
    font-size: 0.85rem;
    border: 1px solid #2563eb;
    border-radius: 6px;
    background: #2563eb;
    color: #fff;
    cursor: pointer;
    transition: opacity 0.15s;
}
.btn-refresh:hover { opacity: 0.88; }
.btn-refresh:disabled { opacity: 0.6; cursor: not-allowed; }

.hot-card {
    background: #fff;
    border-radius: 12px;
    padding: 1.25rem 1.5rem;
    margin-bottom: 1.5rem;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
}
.hot-card-head { display: flex; align-items: baseline; gap: 0.75rem; flex-wrap: wrap; }
.hot-rank {
    background: #2563eb;
    color: #fff;
    font-size: 0.78rem;
    font-weight: 600;
    padding: 0.15rem 0.55rem;
    border-radius: 4px;
}
.hot-name { font-size: 1.2rem; font-weight: 700; color: #222; }
.hot-code { font-size: 0.82rem; color: #999; }
.hot-stat-note { color: #aaa; font-size: 0.76rem; }
.hot-change { font-size: 1.2rem; font-weight: 700; margin-left: auto; }

.hot-stats {
    display: flex;
    flex-wrap: wrap;
    gap: 1.5rem;
    margin-top: 0.75rem;
    font-size: 0.88rem;
    color: #666;
}
.hot-stats b { color: #222; font-weight: 600; }

.hot-reason {
    margin-top: 0.9rem;
    padding: 0.75rem 1rem;
    background: #f7f9fc;
    border-left: 3px solid #2563eb;
    border-radius: 0 6px 6px 0;
    font-size: 0.9rem;
    line-height: 1.6;
    color: #333;
}
.hot-reason-label {
    display: inline-block;
    margin-right: 0.6rem;
    font-size: 0.78rem;
    font-weight: 600;
    color: #2563eb;
}

.hot-table-wrap { margin-top: 1rem; overflow-x: auto; }
.hot-table { width: 100%; border-collapse: collapse; font-size: 0.86rem; }
.hot-table th {
    text-align: right;
    font-weight: 600;
    color: #888;
    padding: 0.5rem 0.6rem;
    border-bottom: 1px solid #e8ecf0;
    white-space: nowrap;
}
.hot-table th:nth-child(1), .hot-table th:nth-child(2) { text-align: left; }
.hot-table td {
    text-align: right;
    padding: 0.5rem 0.6rem;
    border-bottom: 1px solid #f2f5f8;
    color: #333;
    white-space: nowrap;
}
.hot-table td:nth-child(1), .hot-table td:nth-child(2) { text-align: left; }
.hot-table tbody tr:hover { background: #fafbfd; }
.hot-table .mono { font-variant-numeric: tabular-nums; }

/* A 股惯例：涨红跌绿 */
.up { color: #dc3545; }
.down { color: #16a34a; }
.hot-empty { text-align: center !important; color: #999; }
.hot-warn {
    padding: 0.7rem 1rem;
    background: #fffbeb;
    border: 1px solid #fde68a;
    border-radius: 8px;
    font-size: 0.85rem;
    color: #b45309;
}
.hot-empty-state {
    background: #fff;
    border-radius: 12px;
    padding: 3rem 1.5rem;
    text-align: center;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
}
.hot-empty-state h2 { margin: 0 0 0.5rem; font-size: 1.1rem; color: #555; }
.hot-empty-state p { margin: 0; color: #888; font-size: 0.9rem; }
.hot-error-detail {
    margin: 0.75rem auto 0 !important;
    max-width: 640px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 0.78rem !important;
    color: #999 !important;
    word-break: break-all;
}
</style>
{% endblock %}
