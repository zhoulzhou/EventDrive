{% extends "base.html" %}

{% block title %}市场行情 - 新闻抓取应用{% endblock %}

{% block content %}
<div class="page-header">
    <h1>市场行情</h1>
    <p class="form-hint" id="metaInfo">数据来源：FRED（美国圣路易斯联储）</p>
</div>

<div id="marketGrid" class="sources-grid">
    <div class="loading">加载中...</div>
</div>

<div class="filter-bar" style="margin-top: 1.5rem;">
    <button id="refreshBtn" class="btn btn-primary">🔄 刷新数据</button>
</div>

<div class="chart-section">
    <div class="chart-header">
        <h2>历史走势</h2>
        <span class="chart-sub">上下双面板共享 X 轴：上方纳斯达克原始点位，下方 VIX 与美债收益率</span>
    </div>
    <div id="historyEmpty" class="history-empty" style="position:static;display:none;">加载中...</div>
    <div class="panel-top">
        <div class="panel-title">纳斯达克指数（原始点位）</div>
        <div class="history-wrap">
            <canvas id="chartTop"></canvas>
        </div>
    </div>
    <div class="panel-bottom">
        <div class="panel-title">VIX 恐慌指数 · 美债2年期 · 美债10年期收益率（%）</div>
        <div class="history-wrap">
            <canvas id="chartBottom"></canvas>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script>
const CHART_COLORS = {
    NASDAQCOM: '#2563eb',
    VIXCLS: '#ef4444',
    DGS2: '#059669',
    DGS10: '#f59e0b'
};
let chartTop = null;
let chartBottom = null;

async function loadMarket() {
    const grid = document.getElementById('marketGrid');
    grid.innerHTML = '<div class="loading">加载中...</div>';

    try {
        const response = await fetchWithAuth('/api/market');
        const data = await response.json();

        if (data.status !== 'ok') {
            grid.innerHTML = `<div class="error-state"><h2>加载失败</h2><p>${escapeHtml(data.message || '未知错误')}</p></div>`;
            return;
        }

        const meta = document.getElementById('metaInfo');
        meta.textContent = `数据来源：${data.source} · 更新时间：${data.updated_at}`;

        grid.innerHTML = data.items.map(item => renderCard(item)).join('');
        renderAllHistory(data.items);
    } catch (error) {
        grid.innerHTML = `<div class="error-state"><h2>加载失败</h2><p>${escapeHtml(error.message)}</p></div>`;
    }
}

function renderCard(item) {
    const isYield = item.unit === '%';
    const value = item.value != null ? formatValue(item.value, isYield) : '--';
    const date = item.date ? `数据日期：${item.date}` : '';

    let changeHtml = '';
    if (item.change != null) {
        const cls = item.change >= 0 ? 'up' : 'down';
        const sign = item.change >= 0 ? '+' : '';
        const changeText = `${sign}${formatValue(item.change, isYield)}${item.unit}`;
        const pct = item.change_percent != null ? ` (${sign}${item.change_percent.toFixed(2)}%)` : '';
        changeHtml = `<div class="market-change ${cls}">${changeText}${pct}</div>`;
    }

    return `
        <div class="market-card">
            <div class="market-name">${escapeHtml(item.name)}</div>
            <div class="market-value">${value}<span class="market-unit">${item.unit}</span></div>
            ${changeHtml}
            <div class="market-date">${date}</div>
        </div>
    `;
}

async function renderAllHistory(items) {
    const empty = document.getElementById('historyEmpty');
    // 拉取四个指数全部历史，构建上下双面板共享 X 轴
    const results = await Promise.all(items.map(item =>
        fetchWithAuth(`/api/market/history?symbol=${encodeURIComponent(item.symbol)}`).then(r => r.json())
    ).concat([Promise.resolve({ status: 'ok' })]));
    const series = results.filter(d => d.status === 'ok' && d.points && d.points.length);
    if (!series.length) {
        empty.style.display = 'flex';
        empty.textContent = '暂无历史数据';
        return;
    }
    empty.style.display = 'none';
    empty.textContent = '';
    renderTopPanel(series);
    renderBottomPanel(series);
}

function renderTopPanel(series) {
    // 面板1：纳斯达克原始点位
    const url = series.find(s => s.symbol === 'NASDAQCOM');
    if (!url) return;
    if (chartTop) chartTop.destroy();
    chartTop = new Chart(document.getElementById('chartTop').getContext('2d'), {
        type: 'line',
        data: {
            labels: url.points.map(p => p.date),
            datasets: [{
                label: url.name,
                data: url.points.map(p => p.value),
                borderColor: '#2563eb',
                backgroundColor: '#2563eb22',
                fill: true,
                tension: 0.3,
                pointRadius: 0.5,
                pointHoverRadius: 4
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            interaction: { mode: 'index', intersect: false },
            plugins: {
                legend: { display: true, position: 'top' },
                tooltip: {
                    callbacks: {
                        label: ctx => ` ${ctx.dataset.label}: ${Number(ctx.parsed.y).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`
                    }
                }
            },
            scales: {
                x: { ticks: { display: false } }, // 上方面板不显示 X 刻度，与下方共享
                y: { title: { display: true, text: '点位' } }
            }
        }
    });
}

function renderBottomPanel(series) {
    // 面板2：VIX、2年期、10年期美债收益率，原始数值叠加（共用左轴）
    const list = ['VIXCLS', 'DGS2', 'DGS10'].map(sym => series.find(s => s.symbol === sym)).filter(Boolean);
    if (!list.length) return;
    const labels = list[0].points.map(p => p.date);
    const datasets = list.map(d => ({
        label: d.name,
        data: d.points.map(p => p.value),
        borderColor: CHART_COLORS[d.symbol] || '#666',
        backgroundColor: (CHART_COLORS[d.symbol] || '#666') + '22',
        fill: false,
        tension: 0.3,
        pointRadius: 0.5,
        pointHoverRadius: 4,
        _unit: d.unit || ''
    }));

    if (chartBottom) chartBottom.destroy();
    chartBottom = new Chart(document.getElementById('chartBottom').getContext('2d'), {
        type: 'line',
        data: { labels, datasets },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            interaction: { mode: 'index', intersect: false },
            plugins: {
                legend: { position: 'top' },
                tooltip: {
                    callbacks: {
                        label: ctx => {
                            const u = ctx.dataset._unit === '%' ? '' : '';
                            return ` ${ctx.dataset.label}: ${ctx.parsed.y.toFixed(2)}${u}`;
                        }
                    }
                }
            },
            scales: {
                x: { ticks: { maxTicksLimit: 6 } },
                y: { title: { display: true, text: '数值' } }
            }
        }
    });
}

function formatValue(num, isYield) {
    return isYield ? num.toFixed(3) : num.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

document.getElementById('refreshBtn').addEventListener('click', loadMarket);
loadMarket();
</script>

<style>
.market-card {
    background: white;
    border-radius: 12px;
    padding: 1.5rem;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    text-align: center;
    transition: transform 0.2s, box-shadow 0.2s;
}
.market-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 4px 16px rgba(0,0,0,0.12);
}
.market-name {
    font-weight: 500;
    color: #666;
    margin-bottom: 0.75rem;
}
.market-value {
    font-size: 2rem;
    font-weight: 700;
    color: #333;
}
.market-unit {
    font-size: 1rem;
    font-weight: 400;
    color: #888;
    margin-left: 0.25rem;
}
.market-change {
    font-size: 1rem;
    font-weight: 500;
    margin-top: 0.5rem;
}
.market-change.up { color: #28a745; }
.market-change.down { color: #dc3545; }
.market-date {
    margin-top: 0.75rem;
    font-size: 0.85rem;
    color: #888;
}
.chart-section {
    margin-top: 2rem;
    background: white;
    border-radius: 12px;
    padding: 1.5rem;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}
.chart-header h2 {
    margin: 0;
    font-size: 1.1rem;
    color: #333;
}
.chart-header {
    display: flex;
    align-items: baseline;
    gap: 0.75rem;
}
.chart-sub {
    font-size: 0.85rem;
    color: #999;
}
.history-wrap {
    position: relative;
    height: 250px;
    width: 100%;
}
.panel-top {
    margin-top: 1rem;
    padding-bottom: 0.5rem;
}
.panel-bottom {
    margin-top: 1.25rem;
    border-top: 1px dashed #e5e7eb;
    padding-top: 0.5rem;
}
.panel-title {
    font-weight: 600;
    color: #555;
    font-size: 0.9rem;
    margin-bottom: 0.25rem;
}
.history-empty {
    display: flex;
    align-items: center;
    justify-content: center;
    color: #999;
    font-size: 0.9rem;
}
</style>
{% endblock %}
