{% extends "base.html" %}

{% block title %}市场行情 - 新闻抓取应用{% endblock %}

{% block content %}
<div class="page-header">
    <h1>市场行情</h1>
    <p class="form-hint" id="metaInfo"></p>
</div>

<div id="marketGrid" class="sources-grid">
    <div class="loading">加载中...</div>
</div>

<div class="chart-section">
    <div class="chart-header">
        <h2>历史走势</h2>
        <span class="chart-sub">X 轴统一时间 · Y 轴对齐 · 三面板联动</span>
    </div>
    <div id="historyEmpty" class="history-empty" style="position:static;display:none;">加载中...</div>
    <div class="panel-stack">
        <div class="panel">
            <div class="history-wrap"><canvas id="chartNasdaq"></canvas></div>
        </div>
        <div class="panel">
            <div class="history-wrap"><canvas id="chartVix"></canvas></div>
        </div>
        <div class="panel">
            <div class="history-wrap"><canvas id="chartBond"></canvas></div>
        </div>
    </div>
    <div class="chart-legend" id="chartLegend"></div>
</div>
{% endblock %}

{% block scripts %}
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script>
async function loadMarket() {
    const grid = document.getElementById('marketGrid');
    grid.innerHTML = '<div class="loading">加载中...</div>';

    try {
        const response = await fetchWithAuth('/api/market');
        const data = await response.json();

        if (data.status !== 'ok') {
            grid.innerHTML = `<div class="error-state"><h2>加载失败</h2><p>${escapeHtml(data.message || '未知错误')}</p></div>`;
            return;
        }

        const meta = document.getElementById('metaInfo');
        meta.textContent = `数据来源：${data.source} · 更新时间：${data.updated_at}`;

        grid.innerHTML = data.items.map(item => renderCard(item)).join('');
        renderAllHistory(data.items);
    } catch (error) {
        grid.innerHTML = `<div class="error-state"><h2>加载失败</h2><p>${escapeHtml(error.message)}</p></div>`;
    }
}

function renderCard(item) {
    const isYield = item.unit === '%';
    const value = item.value != null ? formatValue(item.value, isYield) : '--';
    const date = item.date ? `数据日期：${item.date}` : '';

    let changeHtml = '';
    if (item.change != null) {
        const cls = item.change >= 0 ? 'up' : 'down';
        const sign = item.change >= 0 ? '+' : '';
        const changeText = `${sign}${formatValue(item.change, isYield)}${item.unit}`;
        const pct = item.change_percent != null ? ` (${sign}${item.change_percent.toFixed(2)}%)` : '';
        changeHtml = `<div class="market-change ${cls}">${changeText}${pct}</div>`;
    }

    // 纳斯达克100峰值回撤预警行：当前峰值、峰值日期、较峰值涨跌百分比
    let peakHtml = '';
    if (item.peak_value != null) {
        const sign = item.peak_change_percent >= 0 ? '+' : '';
        peakHtml = `<div class="market-peak">当前峰值 ${formatValue(item.peak_value, false)}（${item.peak_date}） · 较峰值 ${sign}${item.peak_change_percent.toFixed(2)}%</div>`;
    }

    return `
        <div class="market-card${item.drawdown_level && item.drawdown_level !== 'normal' ? ' ' + item.drawdown_level : ''}">
            <div class="market-name">${escapeHtml(item.name)}</div>
            <div class="market-value">${value}<span class="market-unit">${item.unit}</span></div>
            ${changeHtml}
            ${peakHtml}
            <div class="market-date">${date}</div>
        </div>
    `;
}

const FIXED_Y_WIDTH = 84;

async function renderAllHistory(items) {
    const empty = document.getElementById('historyEmpty');
    const results = await Promise.all(items.map(item =>
        fetchWithAuth(`/api/market/history?symbol=${encodeURIComponent(item.symbol)}`).then(r => r.json())
    ).concat([Promise.resolve({ status: 'ok' })]));
    const series = results.filter(d => d.status === 'ok' && d.points && d.points.length);
    // 各 symbol 的 10% 回撤事件（峰值日期/值 + 低点日期/值），供图表标记
    const eventsMap = {};
    results.forEach(r => {
        if (r.status === 'ok' && r.symbol && r.drawdown_events) eventsMap[r.symbol] = r.drawdown_events;
    });
    if (!series.length) {
        empty.style.display = 'flex';
        empty.textContent = '暂无历史数据';
        return;
    }
    empty.style.display = 'none';
    empty.textContent = '';

    // 统一时间轴：取所有指数日期并集并排序，缺值填 null，保证三面板 X 轴完全一致
    const nameMap = {};
    const valMap = {};
    series.forEach(s => {
        nameMap[s.symbol] = s.name;
        valMap[s.symbol] = {};
        s.points.forEach(p => valMap[s.symbol][p.date] = p.value);
    });
    const allDates = [...new Set(series.flatMap(s => s.points.map(p => p.date)))].sort();

    const mk = (sym, color, fill) => ({
        label: nameMap[sym] || sym,
        color,
        fill,
        data: allDates.map(d => (valMap[sym] && valMap[sym][d] != null) ? valMap[sym][d] : null)
    });

    const nasdaq = mk('NASDAQ100', '#2563eb', true);
    const vix = mk('VIXCLS', '#ef4444', false);
    const dgs2 = mk('DGS2', '#059669', false);
    const dgs10 = mk('DGS10', '#f59e0b', false);

    renderChart('chartNasdaq', allDates, [nasdaq], { showX: false, unit: '' },
        [drawdownEventsPlugin], { drawdownEvents: { events: eventsMap['NASDAQ100'] || [] } });
    renderChart('chartVix', allDates, [vix], { showX: false, unit: '' });
    renderChart('chartBond', allDates, [dgs2, dgs10], { showX: true, unit: '%' });
    buildLegend([nasdaq, vix, dgs2, dgs10]);
}

// 回撤事件标记插件：在纳斯达克图表中标出 10% 回撤事件的峰值（绿三角+日期）与低点（红圆+日期）
const drawdownEventsPlugin = {
    id: 'drawdownEvents',
    afterDatasetsDraw(chart, args, opts) {
        const events = (opts && opts.events) || [];
        if (!events.length) return;
        const meta = chart.getDatasetMeta(0);
        if (!meta || !meta.data || !meta.data.length) return;
        const ctx = chart.ctx;
        const xScale = chart.scales.x;
        const yScale = chart.scales.y;
        ctx.save();
        events.forEach(ev => {
            const iPeak = chart.data.labels.indexOf(ev.peak_date);
            const iLow = chart.data.labels.indexOf(ev.low_date);
            if (iPeak < 0 || iLow < 0) return;
            const pxPeak = xScale.getPixelForValue(iPeak);
            const pyPeak = yScale.getPixelForValue(ev.peak_value);
            const pxLow = xScale.getPixelForValue(iLow);
            const pyLow = yScale.getPixelForValue(ev.low_value);

            // 峰值：绿色倒三角 + 日期
            ctx.fillStyle = '#16a34a';
            ctx.beginPath();
            ctx.moveTo(pxPeak, pyPeak - 6);
            ctx.lineTo(pxPeak - 5, pyPeak + 2);
            ctx.lineTo(pxPeak + 5, pyPeak + 2);
            ctx.closePath();
            ctx.fill();
            ctx.font = 'bold 9px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillStyle = '#15803d';
            ctx.fillText(ev.peak_date, pxPeak, pyPeak - 8);

            // 低点：红色实心圆 + 日期
            ctx.fillStyle = '#dc2626';
            ctx.beginPath();
            ctx.arc(pxLow, pyLow, 4, 0, Math.PI * 2);
            ctx.fill();
            ctx.font = 'bold 9px sans-serif';
            ctx.fillText(ev.low_date, pxLow, pyLow + 16);
        });
        ctx.restore();
    }
};

function renderChart(canvasId, labels, datasets, opts, chartPlugins = [], pluginOptions = {}) {
    const canvas = document.getElementById(canvasId);
    const existing = Chart.getChart(canvas);
    if (existing) existing.destroy();

    new Chart(canvas.getContext('2d'), {
        type: 'line',
        data: {
            labels,
            datasets: datasets.map(d => ({
                label: d.label,
                data: d.data,
                borderColor: d.color,
                backgroundColor: d.color + '22',
                fill: d.fill,
                tension: 0.3,
                pointRadius: 0.5,
                pointHoverRadius: 4,
                _unit: opts.unit
            }))
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            interaction: { mode: 'index', intersect: false },
            plugins: {
                legend: { display: false },
                tooltip: {
                    callbacks: {
                        label: ctx => {
                            const v = ctx.parsed.y;
                            const shown = opts.unit === '%'
                                ? v.toFixed(2)
                                : Number(v).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
                            return ` ${ctx.dataset.label}: ${shown}`;
                        }
                    }
                },
                drawdownEvents: pluginOptions.drawdownEvents || { events: [] }
            },
            scales: {
                x: {
                    display: true,
                    border: { display: false },
                    grid: { color: '#eef1f4' }, // 始终显示垂直网格，使三面板连成一线
                    ticks: opts.showX ? { maxTicksLimit: 8 } : { display: false }
                },
                y: {
                    // 固定 Y 轴宽度，使三个面板绘图区左边界一致，实现 X 轴垂直对齐
                    afterFit: axis => { axis.width = FIXED_Y_WIDTH; },
                    grid: { color: '#ecf0f3' },
                    ticks: { maxTicksLimit: 5 }
                }
            }
        },
        plugins: chartPlugins
    });
}

function buildLegend(entries) {
    const el = document.getElementById('chartLegend');
    el.innerHTML = entries.map(e =>
        `<span class="legend-item"><i class="legend-dot" style="background:${e.color}"></i>${escapeHtml(e.label)}</span>`
    ).join('');
}

function formatValue(num, isYield) {
    return isYield ? num.toFixed(3) : num.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

loadMarket();
</script>

<style>
.market-card {
    background: white;
    border-radius: 12px;
    padding: 1.5rem;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    text-align: center;
    transition: transform 0.2s, box-shadow 0.2s;
}
.market-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 4px 16px rgba(0,0,0,0.12);
}
.market-name {
    font-weight: 500;
    color: #666;
    margin-bottom: 0.75rem;
}
.market-value {
    font-size: 2rem;
    font-weight: 700;
    color: #333;
}
.market-unit {
    font-size: 1rem;
    font-weight: 400;
    color: #888;
    margin-left: 0.25rem;
}
.market-change {
    font-size: 1rem;
    font-weight: 500;
    margin-top: 0.5rem;
}
.market-change.up { color: #28a745; }
.market-change.down { color: #dc3545; }
.market-peak {
    margin-top: 0.5rem;
    font-size: 0.85rem;
    color: #888;
}
/* 纳斯达克100峰值回撤分级：回撤 <5% 绿 / 5%~10% 黄 / >=10% 红 */
.market-card.ok {
    border: 2px solid #28a745;
    background: #f0faf4;
}
.market-card.ok .market-value { color: #16a34a; }
.market-card.ok .market-peak { color: #16a34a; }
.market-card.warn {
    border: 2px solid #eab308;
    background: #fffbeb;
}
.market-card.warn .market-value { color: #d97706; }
.market-card.warn .market-peak { color: #d97706; }
.market-card.danger {
    border: 2px solid #dc3545;
    background: #fff5f5;
}
.market-card.danger .market-value { color: #dc3545; }
.market-card.danger .market-peak { color: #dc3545; }
.market-date {
    margin-top: 0.75rem;
    font-size: 0.85rem;
    color: #888;
}
.chart-section {
    margin-top: 2rem;
    background: white;
    border-radius: 12px;
    padding: 1.5rem;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}
.chart-header h2 {
    margin: 0;
    font-size: 1.1rem;
    color: #333;
}
.chart-header {
    display: flex;
    align-items: baseline;
    gap: 0.75rem;
}
.chart-sub {
    font-size: 0.85rem;
    color: #999;
}
.panel-stack {
    margin-top: 1rem;
    border: 1px solid #e5e7eb;
    border-radius: 10px;
    overflow: hidden;
}
.panel + .panel {
    border-top: 1px dashed #dde1e6;
}
.panel .history-wrap {
    position: relative;
    height: 95px;
    width: 100%;
}
.panel-stack .panel:last-child .history-wrap {
    height: 105px; /* 底部多留一点空位给 X 轴刻度 */
}
.chart-legend {
    display: flex;
    flex-wrap: wrap;
    gap: 1.25rem;
    margin-top: 0.75rem;
    border-top: 1px solid #eef1f4;
    padding-top: 0.75rem;
}
.legend-item {
    display: inline-flex;
    align-items: center;
    gap: 0.45rem;
    font-size: 0.88rem;
    color: #555;
}
.legend-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    display: inline-block;
}
.history-empty {
    display: flex;
    align-items: center;
    justify-content: center;
    color: #999;
    font-size: 0.9rem;
}
</style>
{% endblock %}
