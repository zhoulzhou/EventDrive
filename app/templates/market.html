{% extends "base.html" %}

{% block title %}市场行情 - 市场总览{% endblock %}

{% block content %}
<div class="page-header">
    <p class="form-hint" id="metaInfo"></p>
</div>

<div id="marketGrid" class="sources-grid">
    <div class="loading">加载中...</div>
</div>

<div class="chart-section">
    <div class="chart-header">
        <h2>历史走势</h2>
        <div style="display:flex;align-items:center;gap:12px;">
            <span class="chart-sub">X 轴统一时间 · Y 轴对齐 · 三面板联动</span>
            <button id="cleanupBtn" type="button" class="cleanup-btn">清洗数据</button>
        </div>
    </div>
    <div id="historyEmpty" class="history-empty" style="position:static;display:none;">加载中...</div>
    <div id="historyTip" class="history-tip" style="display:none;"></div>
    <div class="panel-stack">
        <div class="panel">
            <div class="history-wrap" id="historyChart"></div>
        </div>
    </div>
    <div class="chart-legend" id="chartLegend"></div>
</div>
{% endblock %}

{% block scripts %}
<script src="/static/js/echarts.min.js?v={{ vendor_ver }}"></script>
<script>
async function loadMarket() {
    const grid = document.getElementById('marketGrid');
    grid.innerHTML = '<div class="loading">加载中...</div>';

    try {
        const response = await fetchWithAuth('/api/market');
        const data = await response.json();

        if (data.status !== 'ok') {
            grid.innerHTML = `<div class="error-state"><h2>加载失败</h2><p>${escapeHtml(data.message || '未知错误')}</p></div>`;
            return;
        }

        const meta = document.getElementById('metaInfo');
        meta.textContent = `数据来源：${data.source} · 更新时间：${data.updated_at}`;

        grid.innerHTML = data.items.map(item => renderCard(item)).join('');
        renderAllHistory(data.items);
    } catch (error) {
        grid.innerHTML = `<div class="error-state"><h2>加载失败</h2><p>${escapeHtml(error.message)}</p></div>`;
    }
}

function renderCard(item) {
    const isYield = item.unit === '%';
    const value = item.value != null ? formatValue(item.value, isYield) : '--';
    const date = item.date ? `数据日期：${item.date}` : '';

    let changeHtml = '';
    if (item.change != null) {
        const cls = item.change >= 0 ? 'up' : 'down';
        const sign = item.change >= 0 ? '+' : '';
        const changeText = `${sign}${formatValue(item.change, isYield)}${item.unit}`;
        const pct = item.change_percent != null ? ` (${sign}${item.change_percent.toFixed(2)}%)` : '';
        changeHtml = `<div class="market-change ${cls}">${changeText}${pct}</div>`;
    }

    // 纳斯达克100峰值回撤预警行：当前峰值、峰值日期、较峰值涨跌百分比
    let peakHtml = '';
    if (item.peak_value != null) {
        const sign = item.peak_change_percent >= 0 ? '+' : '';
        peakHtml = `<div class="market-peak">当前峰值 ${formatValue(item.peak_value, false)}（${item.peak_date}） · 较峰值 ${sign}${item.peak_change_percent.toFixed(2)}%</div>`;
    }

    return `
        <div class="market-card${item.drawdown_level && item.drawdown_level !== 'normal' ? ' ' + item.drawdown_level : ''}">
            <div class="market-name">${escapeHtml(item.name)}</div>
            <div class="market-value">${value}<span class="market-unit">${item.unit}</span></div>
            ${changeHtml}
            ${peakHtml}
            <div class="market-date">${date}</div>
        </div>
    `;
}

// ============================================================================
// 历史走势：ECharts 单实例多 grid 方案
// ----------------------------------------------------------------------------
// 为什么不用 Chart.js：三个面板各自独立成图时，内置 X 轴网格依赖各自的
// autoSkip 结果（面板高度不同 → 刻度数不同 → 竖线错开），
// 而悬停联动竖线走 getPixelForValue、网格线走 getPixelForTick，两条路径
// 本身就不一致。要对齐得手写插件 + 手动锁定 min/max 逐一打补丁。
//
// ECharts 的 axisPointer.link 就是为这个场景设计的：多个 grid 共用一套
// category 轴，指示器与竖线由库统一计算，**天然像素级对齐**，无需手算。
// ============================================================================
const HISTORY_H = 348;          // 三面板总高度（须与 CSS .history-wrap 的 height 一致）
const PANEL_GAP = 34;           // 面板间距：需容下每行上方的指标名标题
const AXIS_LABEL_W = 74;         // 固定 Y 轴标签宽度，保证三个 grid 左边界一致

const historySync = { allDates: [], valMap: {}, nameMap: {}, colorOf: {}, syms: [], chart: null, idx: -1 };

function formatVal(v, unit) {
    if (v == null) return '--';
    return unit === '%'
        ? Number(v).toFixed(2)
        : Number(v).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

// Y 轴刻度的紧凑数字（30000 → 3万），避免长数字挤占绘图区宽度
function compactNumber(v) {
    const n = Number(v);
    if (!isFinite(n)) return '';
    if (Math.abs(n) >= 10000) return (n / 10000).toFixed(1).replace(/\.0$/, '') + '万';
    if (Math.abs(n) >= 1000) return (n / 1000).toFixed(1).replace(/\.0$/, '') + 'k';
    return String(Math.round(n * 100) / 100);
}

function renderHistoryTip(mx = -1, my = -1) {
    const tip = document.getElementById('historyTip');
    if (!tip) return;
    const { idx, allDates, valMap, nameMap, colorOf, syms } = historySync;
    if (idx < 0 || idx >= allDates.length) { tip.style.display = 'none'; return; }
    const date = allDates[idx];
    const rows = syms.filter(s => valMap[s]).map(s => {
        const v = valMap[s][date];
        const unit = s === 'DGS2' || s === 'DGS10' ? '%' : '';
        return `<div class="tip-row"><span class="tip-dot" style="background:${colorOf[s]}"></span>`
            + `<span class="tip-name">${escapeHtml(nameMap[s] || s)}</span>`
            + `<span class="tip-val">${formatVal(v, unit)}</span></div>`;
    }).join('');
    tip.innerHTML = `<div class="tip-date">${date}</div>${rows}`;
    tip.style.display = 'block';
    tip.style.left = '0px';
    tip.style.top = '0px';
    const tw = tip.offsetWidth;
    const th = tip.offsetHeight;
    const pad = 14;
    let x = mx + pad;
    let y = my + pad;
    if (mx < 0 || my < 0) { tip.style.left = '-9999px'; tip.style.top = '-9999px'; return; }
    if (x + tw > window.innerWidth - 8) x = mx - tw - pad;
    if (y + th > window.innerHeight - 8) y = my - th - pad;
    tip.style.left = x + 'px';
    tip.style.top = y + 'px';
}

async function renderAllHistory(items) {
    const empty = document.getElementById('historyEmpty');
    // 图表库未就绪时给出明确提示，避免静默空白（用户分不清是数据问题还是脚本问题）
    if (typeof echarts === 'undefined') {
        empty.style.display = 'flex';
        empty.textContent = '图表库加载失败，请刷新页面重试';
        return;
    }
    if (!items || !items.length) {
        empty.style.display = 'flex';
        empty.textContent = '暂无历史数据';
        return;
    }
    const results = await Promise.all(items.map(item =>
        fetchWithAuth(`/api/market/history?symbol=${encodeURIComponent(item.symbol)}`).then(r => r.json())
    ));
    const series = results.filter(d => d.status === 'ok' && d.points && d.points.length);
    // 各 symbol 的 10% 回撤事件（峰值日期/值 + 低点日期/值），供图表标记
    const eventsMap = {};
    results.forEach(r => {
        if (r.status === 'ok' && r.symbol && r.drawdown_events) eventsMap[r.symbol] = r.drawdown_events;
    });
    if (!series.length) {
        empty.style.display = 'flex';
        empty.textContent = '暂无历史数据';
        return;
    }
    empty.style.display = 'none';
    empty.textContent = '';

    // 统一时间轴：取所有指标日期并集并排序，缺失值填 null，
    // 保证四条曲线端点对齐（不因部分指标缺数据而裁剪日期）
    const nameMap = {};
    const valMap = {};
    series.forEach(s => {
        nameMap[s.symbol] = s.name;
        valMap[s.symbol] = {};
        s.points.forEach(p => valMap[s.symbol][p.date] = p.value);
    });
    const allDates = [...new Set(series.flatMap(s => s.points.map(p => p.date)))].sort();

    const mk = (sym, color, fill) => ({
        label: nameMap[sym] || sym,
        color,
        fill,
        data: allDates.map(d => (valMap[sym] && valMap[sym][d] != null) ? valMap[sym][d] : null)
    });
    const nasdaq = mk('NASDAQ100', '#2563eb', true);
    const vix = mk('VIXCLS', '#ef4444', false);
    const dgs2 = mk('DGS2', '#059669', false);
    const dgs10 = mk('DGS10', '#f59e0b', false);

    Object.assign(historySync, {
        allDates,
        valMap,
        nameMap,
        colorOf: { NASDAQ100: '#2563eb', VIXCLS: '#ef4444', DGS2: '#059669', DGS10: '#f59e0b' },
        syms: ['NASDAQ100', 'VIXCLS', 'DGS2', 'DGS10'],
        idx: -1,
    });

    // ---- 三个 grid 的纵向布局：等高，底部留出 X 轴标签空间 ----
    // ⚠️ 三个 grid 的 left 必须完全相同，绘图区左边界才会严格对齐；
    //    固定留出 AXIS_LABEL_W 给 Y 轴数值，标签有无都不影响曲线起点。
    const topPad = 22;           // 顶部留白：第一行标题要放在 grid 上方
    const xAxisH = 20;
    const panelH = (HISTORY_H - topPad - xAxisH - PANEL_GAP * 2) / 3;
    const grids = [0, 1, 2].map(i => ({
        left: AXIS_LABEL_W,
        right: 26,
        // 每行网格再下移一点，给标题让位
        top: topPad + i * (panelH + PANEL_GAP),
        height: panelH,
    }));
    // 每个 grid 一套 category 轴，但都指向**同一份** allDates；
    // axisPointer.link 让三者的指示器联动，竖线由库保证对齐。
    const mkCatAxis = (gridIndex, showLabels) => ({
        type: 'category',
        gridIndex,
        data: allDates,
        boundaryGap: false,
        axisLine: { show: false },
        axisTick: { show: false },
        splitLine: { show: true, lineStyle: { color: '#f0f3f6', width: 1 } },
        axisLabel: showLabels
            ? {
                show: true, color: '#9aa3ab', fontSize: 10, margin: 8,
                interval: Math.max(1, Math.ceil(allDates.length / 8) - 1),
                hideOverlap: true,
                formatter: v => String(v).slice(5),   // 只显示 MM-DD，省宽度
            }
            : { show: false },
    });
    // 每个面板都显示 Y 轴数值（原来只有第一面板显示，其余像空面板）；
    // scale:true让 Y 轴贴着数据范围走，曲线起伏才看得出来。
    const mkValAxis = (gridIndex, unit, name) => ({
        type: 'value',
        gridIndex,
        scale: true,
        splitNumber: 3,
        axisLine: { show: false },
        axisTick: { show: false },
        splitLine: { show: true, lineStyle: { color: '#f0f3f6', width: 1 } },
        axisLabel: {
            show: true,
            color: '#9aa3ab', fontSize: 10, margin: 8,
            showMinLabel: false, showMaxLabel: false,
            formatter: v => (unit === '%' ? Number(v).toFixed(1) : compactNumber(v)),
        },
    });

    const lineSeries = (s, gridIndex, yAxisIndex = 0) => ({
        name: s.label,
        type: 'line',
        xAxisIndex: gridIndex,
        yAxisIndex: gridIndex,
        data: s.data,
        showSymbol: false,
        symbol: 'circle',
        symbolSize: 5,
        smooth: 0.3,
        connectNulls: false,
        lineStyle: { width: 1.6, color: s.color },
        itemStyle: { color: s.color },
        areaStyle: s.fill ? { color: s.color + '18' } : undefined,
        z: 3,
    });

    const option = {
        animation: false,
        backgroundColor: 'transparent',
        // ★ 核心：三个 grid 的 X 轴指示器联动，竖线必然连成一条
        axisPointer: {
            link: [{ xAxisIndex: 'all' }],
            label: { show: false },
            lineStyle: { color: 'rgba(37,99,235,0.6)', width: 1.5, type: [4, 4] },
            triggerTip: false,
        },
        //⚠️ 不能设show:false —— ECharts 的 axisPointer 挂在 tooltip 触发链路上，
        // 一关竖线就没了。改为触发但不渲染浮框（透明 + 空 formatter），
        // 内容仍由外部 historyTip 统一呈现。
        tooltip: {
            trigger: 'axis',
            triggerOn: 'mousemove',
            show: true,
            formatter: () => '',
            backgroundColor: 'rgba(0,0,0,0)',
            borderWidth: 0,
            padding: 0,
            textStyle: { color: 'transparent' },
        },
        grid: grids,
        // 每行左侧的指标名，让三个面板一眼可辨（原来只有图例在下方，脱离上下文看不知道谁是谁）
        title: [
            {
                text: '纳斯达克100',
                left: 6, top: grids[0].top - 2,
                textStyle: { fontSize: 11, fontWeight: 'bold', color: '#5b6570' },
            },
            {
                text: 'VIX 恐慌指数',
                left: 6, top: grids[1].top - 2,
                textStyle: { fontSize: 11, fontWeight: 'bold', color: '#5b6570' },
            },
            {
                text: '美债收益率 2年 / 10年',
                left: 6, top: grids[2].top - 2,
                textStyle: { fontSize: 11, fontWeight: 'bold', color: '#5b6570' },
            },
        ],
        xAxis: [mkCatAxis(0, false), mkCatAxis(1, false), mkCatAxis(2, true)],
        yAxis: [mkValAxis(0, '', nasdaq.label), mkValAxis(1, '', vix.label), mkValAxis(2, '%', dgs2.label)],
        series: [
            lineSeries(nasdaq, 0),
            lineSeries(vix, 1),
            lineSeries(dgs2, 2),
            lineSeries(dgs10, 2),
        ],
    };

    // 回撤事件标记：纳斯达克面板上的峰值（绿三角）与低点（红圆）
    const events = eventsMap['NASDAQ100'] || [];
    if (events.length) {
        option.series.push({
            name: 'drawdown',
            type: 'scatter',
            xAxisIndex: 0,
            yAxisIndex: 0,
            symbol: 'triangle',
            symbolSize: 9,
            data: events.map(ev => [ev.peak_date, ev.peak_value]),
            itemStyle: { color: '#16a34a' },
            label: {
                show: true, position: 'top', color: '#15803d', fontSize: 9,
                formatter: p => p.value[0],
            },
            tooltip: { show: false },
            z: 5,
        });
        option.series.push({
            name: 'drawdownLow',
            type: 'scatter',
            xAxisIndex: 0,
            yAxisIndex: 0,
            symbol: 'circle',
            symbolSize: 7,
            data: events.map(ev => [ev.low_date, ev.low_value]),
            itemStyle: { color: '#dc2626' },
            label: {
                show: true, position: 'bottom', color: '#b91c1c', fontSize: 9,
                formatter: p => p.value[0],
            },
            tooltip: { show: false },
            z: 5,
        });
    }

    const el = document.getElementById('historyChart');
    if (historySync.chart) historySync.chart.dispose();
    const chart = echarts.init(el, null, { renderer: 'canvas' });
    chart.setOption(option);
    historySync.chart = chart;

    // 悬停：用 axisPointer 的数据索引驱动统一 tooltip
    chart.on('updateAxisPointer', e => {
        const info = e.axesInfo && e.axesInfo[0];
        if (!info) return;
        historySync.idx = typeof info.value === 'number' ? info.value : -1;
        renderHistoryTip(...currentMousePos);
    });
    chart.getZr().on('mousemove', e => {
        currentMousePos = [e.offsetX + el.getBoundingClientRect().left,
        e.offsetY + el.getBoundingClientRect().top];
        if (historySync.idx >= 0) renderHistoryTip(currentMousePos[0], currentMousePos[1]);
    });
    chart.getZr().on('globalout', () => {
        historySync.idx = -1;
        renderHistoryTip();
    });

    // 容器尺寸变化时重绘（左右面板布局在响应式下会变）
    window.addEventListener('resize', () => chart.resize());

    buildLegend([nasdaq, vix, dgs2, dgs10]);
}

let currentMousePos = [-1, -1];

function buildLegend(entries) {
    const el = document.getElementById('chartLegend');
    el.innerHTML = entries.map(e =>
        `<span class="legend-item"><i class="legend-dot" style="background:${e.color}"></i>${escapeHtml(e.label)}</span>`
    ).join('');
}

function formatValue(num, isYield) {
    return isYield ? num.toFixed(3) : num.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

document.getElementById('cleanupBtn').addEventListener('click', async () => {
        if (!confirm('确认清洗历史走势数据？将删除同日非空指标数不足 3 的记录，减少曲线断点。')) return;
        const btn = document.getElementById('cleanupBtn');
        btn.disabled = true;
        btn.textContent = '清洗中...';
        try {
            const resp = await fetchWithAuth('/api/market/cleanup', { method: 'POST' });
            const data = await resp.json();
            if (data.status === 'ok') {
                alert(data.deleted > 0 ? `已清洗最近 30 条中的 ${data.deleted} 条记录，请手动刷新页面查看` : '最近 30 条中没有需要清洗的数据');
            } else {
                alert('清洗失败：' + (data.message || '未知错误'));
            }
        } catch (error) {
            alert('清洗失败：' + error.message);
        } finally {
            btn.disabled = false;
            btn.textContent = '清洗数据';
        }
    });

    loadMarket();
</script>

<style>
.history-tip {
    position: fixed;
    left: 0;
    top: 0;
    z-index: 1000;
    background: rgba(255, 255, 255, 0.97);
    border: 1px solid #e0e5ea;
    border-radius: 8px;
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.12);
    padding: 8px 12px;
    min-width: 180px;
    font-size: 0.82rem;
}
.history-tip .tip-date {
    font-weight: 600;
    color: #2563eb;
    margin-bottom: 6px;
    padding-bottom: 6px;
    border-bottom: 1px solid #eef1f4;
}
.history-tip .tip-row {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 2px 0;
}
.history-tip .tip-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
}
.history-tip .tip-name { color: #666; flex: 1; white-space: nowrap; }
.history-tip .tip-val { color: #222; font-weight: 600; white-space: nowrap; }

    padding: 0.3rem 0.9rem;
    font-size: 0.82rem;

    border-radius: 6px;
    background: #fff;
    color: #555;
    cursor: pointer;
    transition: all 0.15s;
}

.cleanup-btn:disabled { opacity: 0.6; cursor: not-allowed; }

}

}
/* ECharts 单实例三 grid：容器高度须与 JS 里的 HISTORY_H 一致，
   否则 grid 布局与容器不匹配。改高度时两处同步改。 */
.panel .history-wrap {
    position: relative;
    height: 348px;
    width: 100%;
}
.chart-legend {
    display: flex;
    flex-wrap: wrap;
