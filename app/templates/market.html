{% extends "base.html" %}

{% block title %}市场行情 - 新闻抓取应用{% endblock %}

{% block content %}
<div class="page-header">
    <p class="form-hint" id="metaInfo"></p>
</div>

<div id="marketGrid" class="sources-grid">
    <div class="loading">加载中...</div>
</div>

<div class="chart-section">
    <div class="chart-header">
        <h2>历史走势</h2>
        <div style="display:flex;align-items:center;gap:12px;">
            <span class="chart-sub">X 轴统一时间 · Y 轴对齐 · 三面板联动</span>
            <button id="cleanupBtn" type="button" class="cleanup-btn">清洗数据</button>
        </div>
    </div>
    <div id="historyEmpty" class="history-empty" style="position:static;display:none;">加载中...</div>
    <div id="historyTip" class="history-tip" style="display:none;"></div>
    <div class="panel-stack">
        <div class="panel">
            <div class="history-wrap"><canvas id="chartNasdaq"></canvas></div>
        </div>
        <div class="panel">
            <div class="history-wrap"><canvas id="chartVix"></canvas></div>
        </div>
        <div class="panel">
            <div class="history-wrap"><canvas id="chartBond"></canvas></div>
        </div>
    </div>
    <div class="chart-legend" id="chartLegend"></div>
</div>
{% endblock %}

{% block scripts %}
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script>
async function loadMarket() {
    const grid = document.getElementById('marketGrid');
    grid.innerHTML = '<div class="loading">加载中...</div>';

    try {
        const response = await fetchWithAuth('/api/market');
        const data = await response.json();

        if (data.status !== 'ok') {
            grid.innerHTML = `<div class="error-state"><h2>加载失败</h2><p>${escapeHtml(data.message || '未知错误')}</p></div>`;
            return;
        }

        const meta = document.getElementById('metaInfo');
        meta.textContent = `数据来源：${data.source} · 更新时间：${data.updated_at}`;

        grid.innerHTML = data.items.map(item => renderCard(item)).join('');
        renderAllHistory(data.items);
    } catch (error) {
        grid.innerHTML = `<div class="error-state"><h2>加载失败</h2><p>${escapeHtml(error.message)}</p></div>`;
    }
}

function renderCard(item) {
    const isYield = item.unit === '%';
    const value = item.value != null ? formatValue(item.value, isYield) : '--';
    const date = item.date ? `数据日期：${item.date}` : '';

    let changeHtml = '';
    if (item.change != null) {
        const cls = item.change >= 0 ? 'up' : 'down';
        const sign = item.change >= 0 ? '+' : '';
        const changeText = `${sign}${formatValue(item.change, isYield)}${item.unit}`;
        const pct = item.change_percent != null ? ` (${sign}${item.change_percent.toFixed(2)}%)` : '';
        changeHtml = `<div class="market-change ${cls}">${changeText}${pct}</div>`;
    }

    // 纳斯达克100峰值回撤预警行：当前峰值、峰值日期、较峰值涨跌百分比
    let peakHtml = '';
    if (item.peak_value != null) {
        const sign = item.peak_change_percent >= 0 ? '+' : '';
        peakHtml = `<div class="market-peak">当前峰值 ${formatValue(item.peak_value, false)}（${item.peak_date}） · 较峰值 ${sign}${item.peak_change_percent.toFixed(2)}%</div>`;
    }

    return `
        <div class="market-card${item.drawdown_level && item.drawdown_level !== 'normal' ? ' ' + item.drawdown_level : ''}">
            <div class="market-name">${escapeHtml(item.name)}</div>
            <div class="market-value">${value}<span class="market-unit">${item.unit}</span></div>
            ${changeHtml}
            ${peakHtml}
            <div class="market-date">${date}</div>
        </div>
    `;
}

const FIXED_Y_WIDTH = 84;

// 跨面板共享的历史曲线 hover 状态：任一图表被悬停时，三面板联动
// 画出同一 X 竖线，并在统一 tooltip(historyTip) 中集中显示各曲线数值
const historySync = { allDates: [], valMap: {}, nameMap: {}, colorOf: {}, syms: [], charts: [], idx: -1 };

function formatVal(v, unit) {
    if (v == null) return '--';
    return unit === '%'
        ? Number(v).toFixed(2)
        : Number(v).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function renderHistoryTip() {
    const tip = document.getElementById('historyTip');
    if (!tip) return;
    const { idx, allDates, valMap, nameMap, colorOf, syms } = historySync;
    if (idx < 0 || idx >= allDates.length) { tip.style.display = 'none'; return; }
    const date = allDates[idx];
    const rows = syms.filter(s => valMap[s]).map(s => {
        const v = valMap[s][date];
        const unit = s === 'DGS2' || s === 'DGS10' ? '%' : '';
        return `<div class="tip-row"><span class="tip-dot" style="background:${colorOf[s]}"></span>`
            + `<span class="tip-name">${nameMap[s] || s}</span>`
            + `<span class="tip-val">${formatVal(v, unit)}</span></div>`;
    }).join('');
    tip.innerHTML = `<div class="tip-date">${date}</div>${rows}`;
    tip.style.display = 'block';
}

// 统一插件：在每一图表的已绘制数据之上叠加一条竖线，标记当前悬停的 X 索引
const crossLinePlugin = {
    id: 'crossLine',
    afterDatasetsDraw(chart) {
        const { idx, allDates } = historySync;
        if (idx < 0 || idx >= allDates.length) return;
        const xScale = chart.scales.x;
        if (!xScale) return;
        const x = xScale.getPixelForValue(idx);
        const { left, right, top, bottom } = chart.chartArea;
        if (x < left || x > right) return;
        const ctx = chart.ctx;
        ctx.save();
        ctx.strokeStyle = 'rgba(37, 99, 235, 0.6)';
        ctx.lineWidth = 1.5;
        ctx.setLineDash([4, 4]);
        ctx.beginPath();
        ctx.moveTo(x, top);
        ctx.lineTo(x, bottom);
        ctx.stroke();
        ctx.restore();
    }
};

async function renderAllHistory(items) {
    const empty = document.getElementById('historyEmpty');
    const results = await Promise.all(items.map(item =>
        fetchWithAuth(`/api/market/history?symbol=${encodeURIComponent(item.symbol)}`).then(r => r.json())
    ).concat([Promise.resolve({ status: 'ok' })]));
    const series = results.filter(d => d.status === 'ok' && d.points && d.points.length);
    // 各 symbol 的 10% 回撤事件（峰值日期/值 + 低点日期/值），供图表标记
    const eventsMap = {};
    results.forEach(r => {
        if (r.status === 'ok' && r.symbol && r.drawdown_events) eventsMap[r.symbol] = r.drawdown_events;
    });
    if (!series.length) {
        empty.style.display = 'flex';
        empty.textContent = '暂无历史数据';
        return;
    }
    empty.style.display = 'none';
    empty.textContent = '';

    // 统一时间轴：取所有指标日期并集并排序，缺失值填 null，保证三面板 X 轴完全一致、
    // 每条曲线端点对齐（不因部分指标缺数据而裁剪日期，避免曲线长短不齐造成"错位"）
    const nameMap = {};
    const valMap = {};
    series.forEach(s => {
        nameMap[s.symbol] = s.name;
        valMap[s.symbol] = {};
        s.points.forEach(p => valMap[s.symbol][p.date] = p.value);
    });
    const allDates = [...new Set(series.flatMap(s => s.points.map(p => p.date)))].sort();

    const mk = (sym, color, fill) => ({
        label: nameMap[sym] || sym,
        color,
        fill,
        data: allDates.map(d => (valMap[sym] && valMap[sym][d] != null) ? valMap[sym][d] : null)
    });

    const nasdaq = mk('NASDAQ100', '#2563eb', true);
    const vix = mk('VIXCLS', '#ef4444', false);
    const dgs2 = mk('DGS2', '#059669', false);
    const dgs10 = mk('DGS10', '#f59e0b', false);

    // 初始化跨面板共享 hover 状态
    Object.assign(historySync, {
        allDates,
        valMap,
        nameMap,
        colorOf: { NASDAQ100: '#2563eb', VIXCLS: '#ef4444', DGS2: '#059669', DGS10: '#f59e0b' },
        syms: ['NASDAQ100', 'VIXCLS', 'DGS2', 'DGS10'],
        charts: [],
        idx: -1,
    });

    // 渲染三面板，均附加 crossLinePlugin（画统一竖线），并收集 chart 实例
    const charts = [
        renderChart('chartNasdaq', allDates, [nasdaq], { showX: false },
            [drawdownEventsPlugin, crossLinePlugin], { drawdownEvents: { events: eventsMap['NASDAQ100'] || [] } }),
        renderChart('chartVix', allDates, [vix], { showX: false },
            [crossLinePlugin]),
        renderChart('chartBond', allDates, [dgs2, dgs10], { showX: true },
            [crossLinePlugin]),
    ].filter(Boolean);
    historySync.charts = charts;

    // 任一图表悬停/离开 → 同步所有面板的竖线位置并刷新统一 tooltip
    charts.forEach(chart => {
        chart.canvas.addEventListener('mousemove', e => {
            const rect = chart.canvas.getBoundingClientRect();
            const xScale = chart.scales.x;
            if (!xScale) return;
            const mouseX = e.clientX - rect.left;
            const idx = xScale.getValueForPixel(mouseX);
            if (idx < 0 || idx >= allDates.length) return;
            if (historySync.idx === idx) { renderHistoryTip(); return; }
            historySync.idx = idx;
            charts.forEach(c => c.draw());
            renderHistoryTip();
        });
        chart.canvas.addEventListener('mouseleave', () => {
            historySync.idx = -1;
            charts.forEach(c => c.draw());
            renderHistoryTip();
        });
    });

    buildLegend([nasdaq, vix, dgs2, dgs10]);
}

// 回撤事件标记插件：在纳斯达克图表中标出 10% 回撤事件的峰值（绿三角+日期）与低点（红圆+日期）
const drawdownEventsPlugin = {
    id: 'drawdownEvents',
    afterDatasetsDraw(chart, args, opts) {
        const events = (opts && opts.events) || [];
        if (!events.length) return;
        const meta = chart.getDatasetMeta(0);
        if (!meta || !meta.data || !meta.data.length) return;
        const ctx = chart.ctx;
        const xScale = chart.scales.x;
        const yScale = chart.scales.y;
        ctx.save();
        events.forEach(ev => {
            const iPeak = chart.data.labels.indexOf(ev.peak_date);
            const iLow = chart.data.labels.indexOf(ev.low_date);
            if (iPeak < 0 || iLow < 0) return;
            const pxPeak = xScale.getPixelForValue(iPeak);
            const pyPeak = yScale.getPixelForValue(ev.peak_value);
            const pxLow = xScale.getPixelForValue(iLow);
            const pyLow = yScale.getPixelForValue(ev.low_value);

            // 峰值：绿色倒三角 + 日期
            ctx.fillStyle = '#16a34a';
            ctx.beginPath();
            ctx.moveTo(pxPeak, pyPeak - 6);
            ctx.lineTo(pxPeak - 5, pyPeak + 2);
            ctx.lineTo(pxPeak + 5, pyPeak + 2);
            ctx.closePath();
            ctx.fill();
            ctx.font = 'bold 9px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillStyle = '#15803d';
            ctx.fillText(ev.peak_date, pxPeak, pyPeak - 8);

            // 低点：红色实心圆 + 日期
            ctx.fillStyle = '#dc2626';
            ctx.beginPath();
            ctx.arc(pxLow, pyLow, 4, 0, Math.PI * 2);
            ctx.fill();
            ctx.font = 'bold 9px sans-serif';
            ctx.fillText(ev.low_date, pxLow, pyLow + 16);
        });
        ctx.restore();
    }
};

function renderChart(canvasId, labels, datasets, opts, chartPlugins = [], pluginOptions = {}) {
    const canvas = document.getElementById(canvasId);
    const existing = Chart.getChart(canvas);
    if (existing) existing.destroy();

    new Chart(canvas.getContext('2d'), {
        type: 'line',
        data: {
            labels,
            datasets: datasets.map(d => ({
                label: d.label,
                data: d.data,
                borderColor: d.color,
                backgroundColor: d.color + '22',
                fill: d.fill,
                tension: 0.3,
                pointRadius: 0.5,
                pointHoverRadius: 4,
                _unit: opts.unit
            }))
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            interaction: { mode: 'index', intersect: false },
            plugins: {
                legend: { display: false },
                // 统一由外部 HTML tooltip(historyTip) 呈现，关闭内置浮框
                tooltip: { enabled: false },
                drawdownEvents: pluginOptions.drawdownEvents || { events: [] }
            },
            scales: {
                x: {
                    display: true,
                    border: { display: false },
                    grid: { color: '#eef1f4' }, // 始终显示垂直网格，使三面板连成一线
                    ticks: opts.showX ? { maxTicksLimit: 8 } : { display: false }
                },
                y: {
                    // 固定 Y 轴宽度，使三个面板绘图区左边界一致，实现 X 轴垂直对齐
                    afterFit: axis => { axis.width = FIXED_Y_WIDTH; },
                    grid: { color: '#ecf0f3' },
                    ticks: { maxTicksLimit: 5 }
                }
            }
        },
        plugins: chartPlugins
    });
    return Chart.getChart(canvas);
}

function buildLegend(entries) {
    const el = document.getElementById('chartLegend');
    el.innerHTML = entries.map(e =>
        `<span class="legend-item"><i class="legend-dot" style="background:${e.color}"></i>${escapeHtml(e.label)}</span>`
    ).join('');
}

function formatValue(num, isYield) {
    return isYield ? num.toFixed(3) : num.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

document.getElementById('cleanupBtn').addEventListener('click', async () => {
        if (!confirm('确认清洗历史走势数据？将删除同日非空指标数不足 3 的记录，减少曲线断点。')) return;
        const btn = document.getElementById('cleanupBtn');
        btn.disabled = true;
        btn.textContent = '清洗中...';
        try {
            const resp = await fetchWithAuth('/api/market/cleanup', { method: 'POST' });
            const data = await resp.json();
            if (data.status === 'ok') {
                alert(data.deleted > 0 ? `已清洗最近 30 条中的 ${data.deleted} 条记录，请手动刷新页面查看` : '最近 30 条中没有需要清洗的数据');
            } else {
                alert('清洗失败：' + (data.message || '未知错误'));
            }
        } catch (error) {
            alert('清洗失败：' + error.message);
        } finally {
            btn.disabled = false;
            btn.textContent = '清洗数据';
        }
    });

    loadMarket();
</script>

    left: 12px;

    z-index: 5;
    background: rgba(255, 255, 255, 0.97);
