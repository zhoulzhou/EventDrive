{% extends "base.html" %}

{% block title %}市场行情 - 新闻抓取应用{% endblock %}

{% block content %}
<div class="page-header">
    <h1>市场行情</h1>
    <p class="form-hint" id="metaInfo">数据来源：FRED（美国圣路易斯联储）</p>
</div>

<div id="marketGrid" class="sources-grid">
    <div class="loading">加载中...</div>
</div>

<div class="filter-bar" style="margin-top: 1.5rem;">
    <button id="refreshBtn" class="btn btn-primary">🔄 刷新数据</button>
</div>

<div class="chart-section">
    <div class="chart-header">
        <h2>历史走势</h2>
    </div>
    <div id="historyGrid" class="history-grid"></div>
</div>
{% endblock %}

{% block scripts %}
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script>
const CHART_COLORS = {
    NASDAQCOM: '#2563eb',
    VIXCLS: '#ef4444',
    DGS2: '#059669',
    DGS10: '#f59e0b'
};
const charts = {};

async function loadMarket() {
    const grid = document.getElementById('marketGrid');
    grid.innerHTML = '<div class="loading">加载中...</div>';

    try {
        const response = await fetchWithAuth('/api/market');
        const data = await response.json();

        if (data.status !== 'ok') {
            grid.innerHTML = `<div class="error-state"><h2>加载失败</h2><p>${escapeHtml(data.message || '未知错误')}</p></div>`;
            return;
        }

        const meta = document.getElementById('metaInfo');
        meta.textContent = `数据来源：${data.source} · 更新时间：${data.updated_at}`;

        grid.innerHTML = data.items.map(item => renderCard(item)).join('');
        renderAllHistory(data.items);
    } catch (error) {
        grid.innerHTML = `<div class="error-state"><h2>加载失败</h2><p>${escapeHtml(error.message)}</p></div>`;
    }
}

function renderCard(item) {
    const isYield = item.unit === '%';
    const value = item.value != null ? formatValue(item.value, isYield) : '--';
    const date = item.date ? `数据日期：${item.date}` : '';

    let changeHtml = '';
    if (item.change != null) {
        const cls = item.change >= 0 ? 'up' : 'down';
        const sign = item.change >= 0 ? '+' : '';
        const changeText = `${sign}${formatValue(item.change, isYield)}${item.unit}`;
        const pct = item.change_percent != null ? ` (${sign}${item.change_percent.toFixed(2)}%)` : '';
        changeHtml = `<div class="market-change ${cls}">${changeText}${pct}</div>`;
    }

    return `
        <div class="market-card">
            <div class="market-name">${escapeHtml(item.name)}</div>
            <div class="market-value">${value}<span class="market-unit">${item.unit}</span></div>
            ${changeHtml}
            <div class="market-date">${date}</div>
        </div>
    `;
}

function renderAllHistory(items) {
    const grid = document.getElementById('historyGrid');
    grid.innerHTML = items.map(item => `
        <div class="history-card">
            <div class="history-title">${escapeHtml(item.name)}</div>
            <div class="history-wrap">
                <canvas id="chart-${escapeHtml(item.symbol)}"></canvas>
                <div class="history-empty" id="empty-${escapeHtml(item.symbol)}">加载中...</div>
            </div>
        </div>
    `).join('');

    items.forEach(item => loadHistoryInto(item));
}

async function loadHistoryInto(item) {
    const empty = document.getElementById('empty-' + item.symbol);
    const canvas = document.getElementById('chart-' + item.symbol);
    try {
        const response = await fetchWithAuth(`/api/market/history?symbol=${encodeURIComponent(item.symbol)}`);
        const data = await response.json();
        if (data.status !== 'ok') {
            empty.innerHTML = '加载失败：' + escapeHtml(data.message || '');
            return;
        }
        if (!data.points.length) {
            empty.innerHTML = '暂无该指数历史数据';
            return;
        }
        empty.style.display = 'none';
        const color = CHART_COLORS[item.symbol] || '#2563eb';
        const unitSuffix = data.unit ? ` ${data.unit}` : '';
        if (charts[item.symbol]) charts[item.symbol].destroy();

        charts[item.symbol] = new Chart(canvas.getContext('2d'), {
            type: 'line',
            data: {
                labels: data.points.map(p => p.date),
                datasets: [{
                    label: data.name,
                    data: data.points.map(p => p.value),
                    borderColor: color,
                    backgroundColor: color + '22',
                    fill: true,
                    tension: 0.3,
                    pointRadius: 1,
                    pointHoverRadius: 4
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                interaction: { mode: 'index', intersect: false },
                plugins: {
                    legend: { display: false },
                    tooltip: {
                        callbacks: {
                            label: ctx => ` ${data.name}: ${ctx.parsed.y}${unitSuffix}`
                        }
                    }
                },
                scales: {
                    x: { ticks: { maxTicksLimit: 5 } },
                    y: { ticks: { callback: v => v + unitSuffix } }
                }
            }
        });
    } catch (error) {
        empty.innerHTML = '加载失败：' + escapeHtml(error.message || '');
    }
}

function formatValue(num, isYield) {
    return isYield ? num.toFixed(3) : num.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

document.getElementById('refreshBtn').addEventListener('click', loadMarket);
loadMarket();
</script>

<style>
.market-card {
    background: white;
    border-radius: 12px;
    padding: 1.5rem;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    text-align: center;
    transition: transform 0.2s, box-shadow 0.2s;
}
.market-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 4px 16px rgba(0,0,0,0.12);
}
.market-name {
    font-weight: 500;
    color: #666;
    margin-bottom: 0.75rem;
}
.market-value {
    font-size: 2rem;
    font-weight: 700;
    color: #333;
}
.market-unit {
    font-size: 1rem;
    font-weight: 400;
    color: #888;
    margin-left: 0.25rem;
}
.market-change {
    font-size: 1rem;
    font-weight: 500;
    margin-top: 0.5rem;
}
.market-change.up { color: #28a745; }
.market-change.down { color: #dc3545; }
.market-date {
    margin-top: 0.75rem;
    font-size: 0.85rem;
    color: #888;
}
.chart-section {
    margin-top: 2rem;
    background: white;
    border-radius: 12px;
    padding: 1.5rem;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}
.chart-header h2 {
    margin: 0;
    font-size: 1.1rem;
    color: #333;
}
.history-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 1.25rem;
    margin-top: 1rem;
}
@media (max-width: 768px) {
    .history-grid { grid-template-columns: 1fr; }
}
.history-card {
    border: 1px solid #e5e7eb;
    border-radius: 10px;
    padding: 0.75rem 1rem 1rem;
}
.history-title {
    font-weight: 600;
    color: #333;
    font-size: 0.95rem;
    margin-bottom: 0.5rem;
}
.history-wrap {
    position: relative;
    height: 210px;
    width: 100%;
}
.history-empty {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #999;
    font-size: 0.9rem;
}
</style>
{% endblock %}
