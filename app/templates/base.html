<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}新闻抓取应用{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/style.css">
    {% block head %}{% endblock %}
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <div class="navbar-brand">
                <a href="/home">新闻抓取</a>
            </div>
            <div class="navbar-menu">
                <a href="/home" class="nav-link">首页</a>
                <a href="/market" class="nav-link">市场行情</a>
                <a href="/hot-sector" class="nav-link">今日热点</a>
                <a href="/index-alarm" class="nav-link">指数预警</a>
                <a href="/macro" class="nav-link">宏观指标</a>
                <a href="/macro-trend" class="nav-link">宏观趋势</a>
                <a href="/stock-temp" class="nav-link">股票指标</a>
                <a href="/stock-trend" class="nav-link">股票趋势</a>
                <a href="/finance" class="nav-link">财务指标</a>
                <a href="/valuation" class="nav-link">公司估值</a>
                <a href="/crawl" class="nav-link">抓取控制</a>
                <button id="logoutBtn" class="btn btn-secondary nav-link" style="background: none; border: none; cursor: pointer; color: #666;">🚪 登出</button>
            </div>
        </div>
    </nav>

    <main class="main-content">
        <div class="container">
            {% block content %}{% endblock %}
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 新闻抓取应用. All rights reserved.</p>
        </div>
    </footer>

    <script src="/static/js/main.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
