{% extends "base.html" %}

{% block title %}新闻列表 - 市场总览{% endblock %}

{% block content %}
<div class="page-header">
    <h1>新闻列表</h1>
    <div class="filter-bar">
        <input type="text" id="searchInput" placeholder="搜索新闻..." class="search-input">
        <span class="filter-hint">仅显示当日新闻（每日 9:15 与 16:17 自动抓取）· 来源：东方财富</span>
    </div>
</div>

<div id="newsList" class="news-list">
</div>

<div id="pagination" class="pagination">
</div>
{% endblock %}

{% block scripts %}
<script>
let currentPage = 1;
const pageSize = 10;

async function loadNews(page = 1) {
    currentPage = page;
    const search = document.getElementById('searchInput').value;

    // 新闻源只保留东方财富（2026-10-24），来源筛选下拉已移除
    // 固定只看当日新闻：不再提供「仅看当日」开关（2026-10-20 起）
    // 多取一条（pageSize+1）用来判断「还有没有下一页」——
    // /api/news 返回的是纯数组、不带总数，之前用 data.length 当总数
    // 导致 totalPages 恒为 1、分页按钮从不出现（只能看到第一页 10 条）。
    let url = `/api/news?skip=${(page - 1) * pageSize}&limit=${pageSize + 1}&today_only=true`;
    if (search) url += `&include_keywords=${encodeURIComponent(search)}`;

    try {
        const response = await fetch(url);
        const data = await response.json();
        const newsList = Array.isArray(data) ? data : data.news || [];
        const hasMore = newsList.length > pageSize;
        renderNewsList(newsList.slice(0, pageSize));
        renderPagination(page, hasMore);
    } catch (error) {
        console.error('加载新闻失败:', error);
    }
}

function renderNewsList(news) {
    const container = document.getElementById('newsList');
    if (news.length === 0) {
        container.innerHTML = '<div class="empty-state">暂无新闻数据</div>';
        return;
    }
    
    container.innerHTML = news.map(item => `
        <div class="news-card" onclick="location.href='/news/${item.id}'">
            <div class="news-card-header">
                <span class="news-source">${item.source}</span>
                <span class="news-time">${formatTime(item.publish_time)}</span>
            </div>
            <h3 class="news-title">${escapeHtml(item.title)}</h3>
            <p class="news-summary">${escapeHtml(item.summary || '')}</p>
        </div>
    `).join('');
}

// 分页：接口不返回总数，用「多取一条」判断是否有下一页，
// 只渲染 上一页 / 当前页 / 下一页，不猜总页数（猜错会出现点进去是空的页）。
function renderPagination(page, hasMore) {
    const container = document.getElementById('pagination');
    if (page <= 1 && !hasMore) {
        container.innerHTML = '';
        return;
    }

    let html = '';
    if (page > 1) {
        html += `<button class="page-btn" onclick="loadNews(${page - 1})">上一页</button>`;
    }
    html += `<span class="page-info">第 ${page} 页</span>`;
    if (hasMore) {
        html += `<button class="page-btn" onclick="loadNews(${page + 1})">下一页</button>`;
    }
    container.innerHTML = html;
}

function formatTime(timeStr) {
    const date = new Date(timeStr);
    return date.toLocaleString('zh-CN');
}

function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

document.getElementById('searchInput').addEventListener('input', debounce(() => loadNews(1), 300));

function debounce(func, wait) {
    let timeout;
    return function(...args) {
        clearTimeout(timeout);
        timeout = setTimeout(() => func.apply(this, args), wait);
    };
}

loadNews();
</script>
{% endblock %}
